[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tlu-agentic-rag-prototype"
version = "0.3.0"
description = "Bounded Agentic RAG prototype for a versioned K37 curriculum snapshot"
requires-python = ">=3.10"
dependencies = ["Flask>=3.1,<4"]

[tool.setuptools.packages.find]
where = ["src"]
